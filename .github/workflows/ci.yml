name: ci
# Status: Ubuntu + Windows, Node 24, green on main. macOS intentionally untested (unclaimed).
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm exec biome lint src tests scripts
      - run: pnpm exec biome format src tests scripts
      - run: pnpm test
      - run: pnpm build
      - run: node scripts/generate-icon-gallery.js --check
      - run: node ./dist/cli/cli.js build README.md
      - run: node ./dist/cli/cli.js check README.md
      - run: node ./dist/cli/cli.js build examples/hero/README.md
      - run: node ./dist/cli/cli.js check examples/hero/README.md
      - run: npm pack --dry-run
