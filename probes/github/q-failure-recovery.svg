<svg xmlns="http://www.w3.org/2000/svg" width="640" height="140" viewBox="0 0 640 140" role="img" aria-labelledby="t d"><title id="t">failure recovery (M1 grammar)</title><desc id="d">send fails at target (red pulse), reroute along alt path, recovery pulse, settle.</desc><rect width="640" height="140" fill="#FFFFFF"/><path id="ef1" d="M150 70 H400" stroke="#4A5A6E" stroke-width="1.75" fill="none"/><path id="ef2" d="M150 90 V110 H400 V90" stroke="#B45309" stroke-width="1.75" stroke-dasharray="6 4" fill="none"/><rect x="40" y="40" width="110" height="60" rx="8" fill="#FFFFFF" stroke="#1A2330" stroke-width="1.5"/><rect x="400" y="40" width="110" height="60" rx="8" fill="#FFFFFF" stroke="#1A2330" stroke-width="1.5"/><circle r="6" fill="#2563EB"><animateMotion id="fsend" dur="0.7s" fill="freeze" calcMode="paced"><mpath href="#ef1"/></animateMotion></circle><circle cx="455" cy="70" r="8" fill="none" stroke="#C0392B" stroke-width="2" opacity="0"><animate attributeName="opacity" values="0;0.9;0" keyTimes="0;0.5;1" dur="0.4s" begin="fsend.end" fill="freeze"/><animate attributeName="r" values="8;18" dur="0.4s" begin="fsend.end" fill="freeze"/></circle><circle r="6" fill="#B45309"><animateMotion id="freroute" dur="0.9s" begin="fsend.end+0.4s" fill="freeze" calcMode="paced"><mpath href="#ef2"/></animateMotion></circle><circle cx="455" cy="70" r="8" fill="none" stroke="#2563EB" stroke-width="2" opacity="0"><animate attributeName="opacity" values="0;0.8;0" keyTimes="0;0.5;1" dur="0.2s" begin="freroute.end" fill="freeze"/><animate attributeName="r" values="8;16" dur="0.2s" begin="freroute.end" fill="freeze"/></circle></svg>
