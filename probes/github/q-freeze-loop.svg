<svg xmlns="http://www.w3.org/2000/svg" width="300" height="140" viewBox="0 0 300 140" role="img" aria-labelledby="t d"><title id="t">probe freeze vs loop</title><desc id="d">left freezes once, right loops</desc><rect width="300" height="140" fill="#FFFFFF"/><circle cx="80" cy="60" r="12" fill="#2563EB"><animate attributeName="r" from="12" to="20" dur="1s" fill="freeze"/></circle><text x="80" y="110" font-size="10" text-anchor="middle">freeze</text><circle cx="220" cy="60" r="12" fill="#2563EB"><animate attributeName="r" values="12;20;12" keyTimes="0;0.5;1" dur="2s" repeatCount="indefinite"/></circle><text x="220" y="110" font-size="10" text-anchor="middle">loop</text></svg>
