# Single-package v0. Internal module boundaries (language/core/renderer/markdown/cli)
# under src/ provide real isolation. Split into @archmark/* only when
# independent consumption justifies it (see ADR-001).
packages: []
# Explicit build-script policy (no interactive prompts): neither script is required —
# esbuild is unused at runtime by our vitest usage, biome runs without postinstall.
allowBuilds:
  '@biomejs/biome': false
  esbuild: false
